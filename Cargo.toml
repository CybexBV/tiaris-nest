[package]
name = "tiaris-nest"
version = "0.2.177"
edition = "2024"
rust-version = "1.85"
description = "UEFI-only PXE/iPXE boot control service for Tiaris-managed infrastructure"
license = "Apache-2.0"
repository = "https://github.com/CybexHQ/tiaris-nest"
readme = "README.md"
publish = false

[features]
# Real-binary compatibility transition used only by Manage's disposable
# resilience release gate.
resilience-qualification-epoch-2 = []
# The install journey (Tiaris deploy/nixos/tests/install_journey_test.nix) runs
# a disposable Manage whose certificate comes from a test CA. A journey build
# also trusts the system certificate store, where its NixOS configuration puts
# that CA. Release builds never set this: they trust the compiled public roots.
journey-system-roots = ["reqwest/rustls-tls-native-roots", "dep:rustls-native-certs"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
# Wraps response bodies to count downloads in flight (already in the graph through axum).
http-body = "1"
libc = "0.2"
mime_guess = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# The site check's TLS probe keeps the certificate an intercepting proxy
# presents (already in the graph through reqwest).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Only with `journey-system-roots`: the site check's own TLS probe reads the
# system store too (the version reqwest's native-roots feature uses).
rustls-native-certs = { version = "0.8", optional = true }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "net", "time", "process", "sync"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
toml = "0.8"
tar = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.14.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
